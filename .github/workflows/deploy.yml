name: Deploy Node.js Application to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install dependencies on GitHub Runner
      - name: Install Dependencies
        run: npm ci --omit=dev

      # Create deployment package
      - name: Create Package
        run: |
          tar -czf node-app.tar.gz \
            app.js \
            views \
            package.json \
            package-lock.json \
            node_modules

      # Setup SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # Copy package to EC2
      - name: Copy Application
        run: |
          scp -i ~/.ssh/ec2_key \
            node-app.tar.gz \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/"

      # Deploy on EC2
      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          # Install Node.js
          curl -fsSL https://rpm.nodesource.com/setup_20.x | sudo bash -
          sudo dnf install -y nodejs

          # Install PM2
          sudo npm install -g pm2

          # Application directory
          sudo mkdir -p /var/www/node-app
          sudo chown -R $USER:$USER /var/www/node-app

          # Deploy application
          rm -rf /var/www/node-app/*
          tar -xzf /tmp/node-app.tar.gz -C /var/www/node-app

          # Start application
          cd /var/www/node-app
          pm2 delete node-app || true
          pm2 start app.js --name node-app
          pm2 save

          EOF