name: Build and Push Node.js Application to Amazon ECR

on:
  push:
    branches:
      - main

jobs:

  # =========================
  # STAGE 1: BUILD & PUSH
  # =========================
  build-and-push:
    runs-on: self-hosted

    steps:

      # -------------------------
      # 1. Checkout Code
      # -------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # -------------------------
      # 2. Setup Node.js
      # -------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # -------------------------
      # 3. Install Dependencies
      # -------------------------
      - name: Install Dependencies
        run: npm ci


      # -------------------------
      # 4. Test Application
      # -------------------------
      - name: Run Tests
        run: npm test


      # -------------------------
      # 5. Login to Amazon ECR
      # -------------------------
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-south-1 | \
          docker login \
            --username AWS \
            --password-stdin \
            144410074489.dkr.ecr.ap-south-1.amazonaws.com


      # -------------------------
      # 6. Build Docker Image
      # -------------------------
      - name: Build Docker Image
        run: |
          docker build \
            -t nodejs-todo-repo:${{ github.sha }} .


      # -------------------------
      # 7. Tag Docker Image
      # -------------------------
      - name: Tag Docker Image
        run: |
          docker tag \
            nodejs-todo-repo:${{ github.sha }} \
            144410074489.dkr.ecr.ap-south-1.amazonaws.com/nodejs-todo-repo:${{ github.sha }}


      # -------------------------
      # 8. Push Docker Image to ECR
      # -------------------------
      - name: Push Docker Image to ECR
        run: |
          docker push \
            144410074489.dkr.ecr.ap-south-1.amazonaws.com/nodejs-todo-repo:${{ github.sha }}


      # -------------------------
      # 9. Deployment Information
      # -------------------------
      - name: Show Image
        run: |
          echo "=========================================="
          echo "Docker image pushed successfully!"
          echo "=========================================="
          echo "ECR Image:"
          echo "144410074489.dkr.ecr.ap-south-1.amazonaws.com/nodejs-todo-repo:${{ github.sha }}"