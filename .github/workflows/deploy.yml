name: Build and Deploy Node.js Application to EKS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "144410074489"
  ECR_REPOSITORY: nodejs-todo-repo
  EKS_CLUSTER_NAME: nodejs-todo-cluster
  K8S_DEPLOYMENT_NAME: nodejs-todo

jobs:

  # ==========================================================
  # STAGE 1: BUILD & TEST
  # ==========================================================
  build-and-test:
    name: Build & Test
    runs-on: self-hosted

    steps:

      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4


      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # 3. Install dependencies
      - name: Install Dependencies
        run: npm ci


      # 4. Run application tests
      - name: Run Tests
        run: npm test


      # 5. Verify AWS identity
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity


  # ==========================================================
  # STAGE 2: BUILD DOCKER IMAGE
  # ==========================================================
  docker-build:
    name: Build Docker Image
    needs: build-and-test
    runs-on: self-hosted

    steps:

      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4


      # 2. Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ env.ECR_REPOSITORY }}:${{ github.sha }} .


      # 3. Show image
      - name: Show Docker Image
        run: |
          docker images | grep ${{ env.ECR_REPOSITORY }}


  # ==========================================================
  # STAGE 3: PUSH IMAGE TO ECR
  # ==========================================================
  push-to-ecr:
    name: Push Image to ECR
    needs: docker-build
    runs-on: self-hosted

    steps:

      # 1. Login to Amazon ECR
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password \
            --region ${{ env.AWS_REGION }} | \
          docker login \
            --username AWS \
            --password-stdin \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com


      # 2. Tag image
      - name: Tag Docker Image
        run: |
          docker tag \
            ${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}


      # 3. Push image
      - name: Push Docker Image to ECR
        run: |
          docker push \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}


      # 4. Show ECR image
      - name: Show ECR Image
        run: |
          echo "=============================================="
          echo "IMAGE PUSHED SUCCESSFULLY"
          echo "=============================================="
          echo ""
          echo "ECR Image:"
          echo "${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"


  # ==========================================================
  # STAGE 4: CONNECT TO EKS
  # ==========================================================
  connect-to-eks:
    name: Connect to EKS
    needs: push-to-ecr
    runs-on: self-hosted

    steps:

      # 1. Configure kubectl for EKS
      - name: Configure EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}


      # 2. Verify EKS connection
      - name: Verify EKS Connection
        run: |
          echo "===== EKS CLUSTER ====="
          kubectl cluster-info

          echo ""
          echo "===== NODES ====="
          kubectl get nodes


  # ==========================================================
  # STAGE 5: DEPLOY TO EKS
  # ==========================================================
  deploy-to-eks:
    name: Deploy Application to EKS
    needs: connect-to-eks
    runs-on: self-hosted

    steps:

      # 1. Configure EKS
      - name: Configure EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}


      # 2. Get container name
      - name: Get Container Name
        run: |
          CONTAINER_NAME=$(kubectl get deployment ${{ env.K8S_DEPLOYMENT_NAME }} \
            -o jsonpath='{.spec.template.spec.containers[0].name}')

          echo "Container Name: $CONTAINER_NAME"

          echo "CONTAINER_NAME=$CONTAINER_NAME" >> $GITHUB_ENV


      # 3. Update deployment image
      - name: Update EKS Deployment
        run: |
          IMAGE="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"

          echo "Deploying image:"
          echo "$IMAGE"

          kubectl set image deployment/${{ env.K8S_DEPLOYMENT_NAME }} \
            $CONTAINER_NAME=$IMAGE


      # 4. Wait for rollout
      - name: Wait for Deployment Rollout
        run: |
          kubectl rollout status \
            deployment/${{ env.K8S_DEPLOYMENT_NAME }} \
            --timeout=180s


  # ==========================================================
  # STAGE 6: POST DEPLOYMENT
  # ==========================================================
  post-deploy:
    name: Post Deployment Verification
    needs: deploy-to-eks
    runs-on: self-hosted

    steps:

      # 1. Configure EKS
      - name: Configure EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}


      # 2. Check deployment
      - name: Check Deployment
        run: |
          echo "=============================================="
          echo "DEPLOYMENT STATUS"
          echo "=============================================="

          kubectl get deployment ${{ env.K8S_DEPLOYMENT_NAME }}


      # 3. Check pods
      - name: Check Pods
        run: |
          echo "=============================================="
          echo "POD STATUS"
          echo "=============================================="

          kubectl get pods -o wide


      # 4. Check service
      - name: Check Service
        run: |
          echo "=============================================="
          echo "SERVICE STATUS"
          echo "=============================================="

          kubectl get svc


      # 5. Check rollout history
      - name: Check Rollout
        run: |
          echo "=============================================="
          echo "ROLLOUT HISTORY"
          echo "=============================================="

          kubectl rollout history deployment/${{ env.K8S_DEPLOYMENT_NAME }}


      # 6. Final status
      - name: Deployment Completed
        run: |
          echo ""
          echo "=============================================="
          echo "   EKS DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "=============================================="
          echo ""
          echo "Cluster:"
          echo "${{ env.EKS_CLUSTER_NAME }}"
          echo ""
          echo "ECR Image:"
          echo "${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          echo ""
          echo "Deployment:"
          echo "${{ env.K8S_DEPLOYMENT_NAME }}"
          echo ""
          echo "Status: SUCCESS"